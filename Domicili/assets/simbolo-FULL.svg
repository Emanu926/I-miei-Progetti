    .feather { fill: none; stroke: #004A7C; stroke-linecap: round; }
    .tongue  { fill: none; stroke: #004A7C; stroke-linecap: round; }
  </style>

  <defs>
    <g id="wingF">
      <path class="c-cad" style="stroke-width:1.3" d="M100,71 C120,61 140,61 153,71 C143,79 122,83 104,81 Z"/>
      <path class="feather" style="stroke-width:2" d="M108,75 C120,71 132,70 147,71"/>
      <path class="feather" style="stroke-width:2" d="M108,78 C119,75 130,75 141,77"/>
    </g>
    <g id="snakeF">
