<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Ambulatorio Medico Veterinario Di Tizio — croce e caduceo">
  <title>Simbolo ufficiale — versione FULL</title>
  <style>
