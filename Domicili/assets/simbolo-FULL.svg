  <rect class="c-cross" x="72" y="28" width="56" height="144" rx="8"/>
  <rect class="c-cross" x="28" y="72" width="144" height="56" rx="8"/>

  <use href="#wingF"/>
  <use href="#wingF" transform="translate(200,0) scale(-1,1)"/>

  <rect class="c-cad" style="stroke-width:1.3" x="96" y="44" width="8" height="130" rx="4"/>
  <circle class="c-cad" style="stroke-width:1.3" cx="100" cy="40" r="7"/>

