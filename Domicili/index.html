<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Calcolo visite</title>
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Visite">
<meta name="theme-color" content="#004A7C">
<style>
  :root {
    --azzurro:        #56CCF2;
    --navy:           #004A7C;
    --navy-scuro:     #003D66;
    --bianco:         #FFFFFF;
    --testo-corpo:    #5A5A5A;
    --testo-scuro:    #333333;
    --sfondo-chiaro:  #F9F9F9;
    --sfondo-azzurrino:#F7FAFF;
    --raggio:         10px;
    --raggio-pillola: 999px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--sfondo-chiaro);
    font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
    color: var(--testo-scuro);
    -webkit-text-size-adjust: 100%;
  }

  /* ---------- Splash ---------- */
  #splash {
    position: fixed;
    inset: 0;
    background: var(--navy);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: opacity 0.5s ease;
  }
  #splash {
    flex-direction: column;
    gap: 14px;
  }
  #splash img {
    width: 40vw;
    max-width: 160px;
    animation: pop 0.6s ease;
  }
  #splash .titolo {
    color: var(--bianco);
    font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 0.3px;
    animation: pop 0.6s ease;
  }
  #splash.nascosto {
    opacity: 0;
    pointer-events: none;
  }
  @keyframes pop {
    from { transform: scale(0.85); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  /* ---------- App ---------- */
  #app {
    max-width: 640px;
    margin: 0 auto;
    padding: 12px 12px 40px;
  }

  header.top {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 4px 14px;
  }
  header.top img { width: 32px; height: 32px; flex: none; }
  header.top .titoli { flex: 1; min-width: 0; }
  header.top h1 {
    font-size: 16px;
    margin: 0;
    color: var(--navy);
    font-weight: 800;
  }
  header.top .data {
    font-size: 12px;
    color: var(--testo-corpo);
    text-transform: capitalize;
  }

  input[type="text"] {
    width: 100%;
    border: 1px solid #DDE3E8;
    border-radius: var(--raggio);
    padding: 9px 10px;
    font-size: 14px;
    font-family: inherit;
    background: var(--bianco);
  }

  .riga-cliente {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .riga-cliente input { flex: 1; }
  .riga-cliente button#btnPulisci {
    flex: none;
    background: none;
    border: 1px solid #DDD;
    color: var(--testo-corpo);
    font-size: 12px;
    font-family: inherit;
    border-radius: var(--raggio-pillola);
    padding: 0 12px;
  }

  section.categoria {
    background: var(--bianco);
    border-radius: var(--raggio);
    margin-bottom: 10px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  button.cat-header {
    width: 100%;
    background: var(--navy);
    color: var(--bianco);
    font-size: 13px;
    font-weight: 700;
    margin: 0;
    padding: 9px 12px;
    letter-spacing: 0.2px;
    border: none;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  button.cat-header .freccia {
    transition: transform 0.2s ease;
    font-size: 11px;
  }
  section.categoria.aperta button.cat-header .freccia {
    transform: rotate(180deg);
  }
  section.categoria .cat-body {
    display: none;
  }
  section.categoria.aperta .cat-body {
    display: block;
  }
  .riga-prodotto {
    display: grid;
    grid-template-columns: 1fr 66px 74px;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    border-top: 1px solid #EFF2F5;
  }
  .riga-prodotto:first-of-type { border-top: none; }
  .riga-prodotto .nome {
    font-size: 13.5px;
    line-height: 1.25;
  }
  .riga-prodotto .nome small {
    display: block;
    color: var(--testo-corpo);
    font-size: 11px;
  }
  .riga-prodotto .nome small .editabile {
    text-decoration: underline dotted;
    text-underline-offset: 2px;
    cursor: pointer;
  }
  .riga-prodotto input[type="number"] {
    width: 100%;
    border: 1px solid #DDE3E8;
    border-radius: 8px;
    padding: 7px 6px;
    font-size: 15px;
    text-align: center;
    font-family: inherit;
    -moz-appearance: textfield;
  }
  .riga-prodotto .guadagno {
    font-size: 12.5px;
    text-align: right;
    color: var(--testo-corpo);
    white-space: nowrap;
  }
  .riga-prodotto .guadagno b {
    display: block;
    color: var(--navy);
    font-size: 13.5px;
  }
  .riga-prodotto button.elimina-prodotto {
    background: none;
    border: none;
    color: #AAA;
    font-size: 11px;
    padding: 2px 0 2px 6px;
    line-height: 1;
    opacity: 0.7;
  }
  .riga-nuovo-prodotto {
    padding: 10px 12px;
    border-top: 1px solid #EFF2F5;
    display: grid;
    grid-template-columns: 1fr;
    gap: 6px;
  }
  .riga-nuovo-prodotto input {
    border: 1px solid #DDE3E8;
    border-radius: 8px;
    padding: 8px 9px;
    font-size: 14px;
    font-family: inherit;
    width: 100%;
  }
  .riga-nuovo-prodotto .campi-numerici {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .riga-nuovo-prodotto button {
    background: var(--azzurro);
    color: var(--navy-scuro);
    border: none;
    border-radius: var(--raggio-pillola);
    font-weight: 700;
    font-family: inherit;
    font-size: 13.5px;
    padding: 9px;
  }

  section.altre {
    background: var(--bianco);
    border-radius: var(--raggio);
    padding: 12px;
    margin-bottom: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  section.altre h2 {
    font-size: 13px;
    font-weight: 700;
    margin: 0 0 8px;
    color: var(--navy);
  }
  .campo-riga {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 5px 0;
    font-size: 13.5px;
  }
  .campo-riga input[type="number"] {
    width: 100px;
    border: 1px solid #DDE3E8;
    border-radius: 8px;
    padding: 7px 6px;
    font-size: 15px;
    text-align: center;
    font-family: inherit;
  }
  .campo-riga.risultato b { color: var(--navy); font-size: 15px; }
  .campo-riga.risultato.diff b { color: var(--azzurro); }

  section.totale {
    background: var(--navy);
    color: var(--bianco);
    border-radius: var(--raggio);
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  section.totale .riga {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    padding: 3px 0;
  }
  section.totale .riga.grande {
    font-size: 20px;
    font-weight: 800;
    padding-top: 6px;
    border-top: 1px solid rgba(255,255,255,0.25);
    margin-top: 6px;
  }
  section.totale .nota-guadagno {
    font-size: 11px;
    font-weight: 400;
    opacity: 0.8;
    text-align: right;
    margin-top: 2px;
  }

  button.salva {
    width: 100%;
    background: var(--azzurro);
    color: var(--navy-scuro);
    border: none;
    border-radius: var(--raggio-pillola);
    font-size: 16px;
    font-weight: 800;
    font-family: inherit;
    padding: 13px;
    margin-bottom: 22px;
  }
  button.salva:active { opacity: 0.85; }

  h2.sezione-giorno {
    font-size: 13px;
    color: var(--testo-corpo);
    font-weight: 700;
    margin: 0 0 8px 2px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  button.cancella-tutto {
    background: none;
    border: 1px solid #DDD;
    color: #B33;
    font-size: 11px;
    border-radius: var(--raggio-pillola);
    padding: 4px 10px;
    font-family: inherit;
  }

  .visita-salvata {
    background: var(--bianco);
    border-radius: var(--raggio);
    margin-bottom: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .visita-salvata summary {
    list-style: none;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .visita-salvata summary::-webkit-details-marker { display: none; }
  .visita-salvata .info { font-size: 13px; line-height: 1.4; }
  .visita-salvata .info .nome { font-weight: 700; color: var(--navy); }
  .visita-salvata .info .ora { color: var(--testo-corpo); font-size: 11.5px; }
  .visita-salvata .guadagno-tot { font-weight: 800; color: var(--navy); font-size: 14px; text-align: right; }
  .visita-salvata .nota-guadagno-salvata {
    font-weight: 400;
    font-size: 10px;
    color: var(--testo-corpo);
    opacity: 0.8;
    white-space: nowrap;
  }
  .visita-salvata .azioni {
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .visita-salvata button.condividi {
    background: none;
    border: none;
    color: var(--navy);
    font-size: 16px;
    padding: 2px 6px;
    line-height: 1;
  }
  .visita-salvata button.elimina {
    background: none;
    border: none;
    color: #B33;
    font-size: 18px;
    padding: 2px 6px;
    line-height: 1;
  }
  .visita-salvata .dettaglio-visita {
    border-top: 1px solid #EFF2F5;
    padding: 8px 12px 10px;
    font-size: 12.5px;
    color: var(--testo-corpo);
  }
  .visita-salvata .dettaglio-visita div { padding: 2px 0; }
  .visita-salvata .dettaglio-visita .riga-altre { color: var(--azzurro); font-weight: 700; }

  .vuoto-giorno {
    color: var(--testo-corpo);
    font-size: 13px;
    text-align: center;
    padding: 10px;
  }
</style>
</head>
<body>

<div id="splash">
  <img src="assets/apple-touch-icon.png" alt="">
  <div class="titolo">Stefy Home Visit</div>
</div>

<div id="app">
  <header class="top">
    <img src="assets/apple-touch-icon.png" alt="">
    <div class="titoli">
      <h1>Calcolo visite a domicilio</h1>
      <div class="data" id="dataOggi"></div>
    </div>
  </header>

  <div class="riga-cliente">
    <input type="text" id="nomeCliente" placeholder="Cliente (facoltativo)">
    <button type="button" id="btnPulisci" title="Svuota cliente, quantità e totale richiesto">Pulisci</button>
  </div>

  <div id="categorie"></div>

  <section class="altre">
    <h2>Altre prestazioni / totale concordato</h2>
    <div class="campo-riga">
      <span>Totale richiesto al cliente</span>
      <input type="number" id="totaleRichiesto" inputmode="decimal" placeholder="0" min="0" step="0.01">
    </div>
    <div class="campo-riga risultato">
      <span>Totale prodotti (calcolato)</span>
      <b id="totaleProdottiMostrato">0,00 €</b>
    </div>
    <div class="campo-riga risultato diff">
      <span>Differenza (altre prestazioni)</span>
      <b id="differenzaMostrata">0,00 €</b>
    </div>
  </section>

  <section class="totale">
    <div class="riga"><span>Incasso prodotti</span><span id="totIncasso">0,00 €</span></div>
    <div class="riga grande"><span>Guadagno</span><span id="totGuadagno">0,00 €</span></div>
    <div class="nota-guadagno" id="notaGuadagno"></div>
  </section>

  <button class="salva" id="btnSalva">Salva visita e passa alla prossima</button>

  <h2 class="sezione-giorno">
    <span id="titoloGiorno">Visite salvate</span>
    <button class="cancella-tutto" id="btnCancellaTutto">Cancella tutto</button>
  </h2>
  <div id="listaVisite"></div>
</div>

<script>
(function () {

  // ---------- Dati prodotti (prezzi del 20/08/2026, da verificare/aggiornare quando cambiano) ----------
  var CATEGORIE_BASE = [
    {
      nome: "Credelio",
      varianti: [
        { id: "credelio-blu",     nome: "Blu",     costo: 6.49, prezzo: 15.46 },
        { id: "credelio-verde",   nome: "Verde",   costo: 6.43, prezzo: 13.70 },
        { id: "credelio-arancio", nome: "Arancio", costo: 5.51, prezzo: 12.27 },
        { id: "credelio-rosa",    nome: "Rosa",    costo: 0,    prezzo: 11.37 },
        { id: "credelio-giallo",  nome: "Giallo",  costo: 6.10, prezzo: 10.53 },
        { id: "credelio-gatto",   nome: "Gatto",   costo: 5.21, prezzo: 11.23 }
      ]
    },
    {
      nome: "Credelio Plus (cane)",
      varianti: [
        { id: "plus-blu",     nome: "Blu",     costo: 7.27, prezzo: 14.02 },
        { id: "plus-verde",   nome: "Verde",   costo: 6.28, prezzo: 13.08 },
        { id: "plus-arancio", nome: "Arancio", costo: 5.78, prezzo: 12.05 },
        { id: "plus-rosa",    nome: "Rosa",    costo: 5.42, prezzo: 11.30 },
        { id: "plus-giallo",  nome: "Giallo",  costo: 5.55, prezzo: 10.87 }
      ]
    },
    {
      nome: "Cardotek",
      varianti: [
        { id: "cardotek-marrone", nome: "Marrone", costo: 29.43, prezzo: 56.20 },
        { id: "cardotek-verde",   nome: "Verde",   costo: 27.89, prezzo: 53.25 },
        { id: "cardotek-blu",     nome: "Blu",     costo: 25.69, prezzo: 49.00 }
      ]
    },
    {
      nome: "Confis (confezione)",
      varianti: [
        { id: "confortis", nome: "Confis", costo: 55.40, prezzo: 100.00 }
      ]
    },
    {
      nome: "NexGard (pipetta)",
      varianti: [
        { id: "nexgard", nome: "NexGard pipetta", costo: 5.48, prezzo: 14.00 }
      ]
    }
  ];

  var TUTTE_VARIANTI = [];

  // ---------- Prodotti personalizzati (aggiunti da Stefania, salvati sul telefono) ----------
  var CHIAVE_PRODOTTI_PERSONALIZZATI = 'prodottiPersonalizzati';
  function caricaProdottiPersonalizzati() {
    try {
      return JSON.parse(localStorage.getItem(CHIAVE_PRODOTTI_PERSONALIZZATI) || '[]');
    } catch (e) { return []; }
  }
  function salvaProdottiPersonalizzati(arr) {
    localStorage.setItem(CHIAVE_PRODOTTI_PERSONALIZZATI, JSON.stringify(arr));
  }

  // ---------- Modifiche a costo/prezzo dei prodotti a listino (localStorage, non toccano i valori di base nel codice) ----------
  var CHIAVE_OVERRIDE_PREZZI = 'overridePrezzi';
  function caricaOverridePrezzi() {
    try {
      return JSON.parse(localStorage.getItem(CHIAVE_OVERRIDE_PREZZI) || '{}');
    } catch (e) { return {}; }
  }
  function salvaOverridePrezzi(obj) {
    localStorage.setItem(CHIAVE_OVERRIDE_PREZZI, JSON.stringify(obj));
  }

  // ---------- Utility ----------
  function euro(n) {
    return n.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
  }
  function dataBreve() {
    return new Date().toLocaleDateString('it-IT');
  }
  function dataLeggibile() {
    var d = new Date();
    var testo = d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    return testo.charAt(0).toUpperCase() + testo.slice(1);
  }

  // ---------- Splash ----------
  window.addEventListener('load', function () {
    setTimeout(function () {
      document.getElementById('splash').classList.add('nascosto');
    }, 2500);
  });

  // ---------- Costruzione UI prodotti (menu a tendina per categoria) ----------
  var contCategorie = document.getElementById('categorie');

  // Cattura/ripristina le quantità già scritte, cosi' ricostruire l'elenco
  // (dopo aver aggiunto/eliminato/modificato un prodotto) non le cancella.
  function catturaQuantita() {
    var mappa = {};
    document.querySelectorAll('#categorie input[type="number"]').forEach(function (inp) {
      if (inp.value !== '') mappa[inp.getAttribute('data-id')] = inp.value;
    });
    return mappa;
  }
  function ripristinaQuantita(mappa) {
    Object.keys(mappa).forEach(function (id) {
      var inp = document.querySelector('#categorie input[data-id="' + id + '"]');
      if (inp) inp.value = mappa[id];
    });
  }
  var NOME_CATEGORIA_PERSONALIZZATA = 'Altri prodotti';

  function costruisciUI(nomeCategoriaDaTenereAperta) {
    contCategorie.innerHTML = '';
    TUTTE_VARIANTI = [];

    var categorie = CATEGORIE_BASE.concat([{
      nome: NOME_CATEGORIA_PERSONALIZZATA,
      personalizzata: true,
      varianti: caricaProdottiPersonalizzati()
    }]);

    var overridePrezzi = caricaOverridePrezzi();

    categorie.forEach(function (cat) {
      var sec = document.createElement('section');
      sec.className = 'categoria';
      if (cat.nome === nomeCategoriaDaTenereAperta) sec.classList.add('aperta');

      var header = document.createElement('button');
      header.type = 'button';
      header.className = 'cat-header';
      header.innerHTML = '<span>' + cat.nome + '</span><span class="freccia">▾</span>';
      header.addEventListener('click', function () {
        sec.classList.toggle('aperta');
      });
      sec.appendChild(header);

      var body = document.createElement('div');
      body.className = 'cat-body';

      cat.varianti.forEach(function (v) {
        var eff = cat.personalizzata ? v : Object.assign({}, v, overridePrezzi[v.id] || {});
        TUTTE_VARIANTI.push(eff);

        var riga = document.createElement('div');
        riga.className = 'riga-prodotto';
        riga.innerHTML =
          '<div class="nome">' + v.nome + '<small>' +
          '<span class="editabile" data-campo="prezzo">' + euro(eff.prezzo) + ' cliente</span> · ' +
          '<span class="editabile" data-campo="costo">costo ' + euro(eff.costo) + '</span>' +
          '</small></div>' +
          '<input type="number" inputmode="numeric" min="0" step="1" placeholder="0" data-id="' + v.id + '">' +
          '<div class="guadagno" data-guadagno="' + v.id + '"><b>0,00 €</b>0,00 € guad.</div>' +
          (cat.personalizzata ? '<button type="button" class="elimina-prodotto" data-elimina-prodotto="' + v.id + '">✕</button>' : '');
        body.appendChild(riga);

        riga.querySelectorAll('.editabile').forEach(function (span) {
          span.addEventListener('click', function () {
            modificaValore(eff, cat.personalizzata, cat.nome, span.getAttribute('data-campo'));
          });
        });
      });

      if (cat.personalizzata) {
        var formNuovo = document.createElement('div');
        formNuovo.className = 'riga-nuovo-prodotto';
        formNuovo.innerHTML =
          '<input type="text" id="nuovoNome" placeholder="Nome prodotto">' +
          '<div class="campi-numerici">' +
          '<input type="number" id="nuovoCosto" placeholder="Costo" step="0.01" min="0">' +
          '<input type="number" id="nuovoPrezzo" placeholder="Prezzo cliente" step="0.01" min="0">' +
          '</div>' +
          '<button type="button" id="btnAggiungiProdotto">+ Aggiungi prodotto</button>';
        body.appendChild(formNuovo);
      }

      sec.appendChild(body);
      contCategorie.appendChild(sec);
    });

    if (document.getElementById('btnAggiungiProdotto')) {
      document.getElementById('btnAggiungiProdotto').addEventListener('click', function () {
        var nome = document.getElementById('nuovoNome').value.trim();
        var costo = parseFloat(document.getElementById('nuovoCosto').value);
        var prezzo = parseFloat(document.getElementById('nuovoPrezzo').value);
        if (!nome) { alert('Inserisci il nome del prodotto.'); return; }
        if (isNaN(costo) || costo < 0) { alert('Inserisci un costo valido.'); return; }
        if (isNaN(prezzo) || prezzo < 0) { alert('Inserisci un prezzo cliente valido.'); return; }

        var elenco = caricaProdottiPersonalizzati();
        elenco.push({ id: 'custom-' + Date.now().toString(36), nome: nome, costo: costo, prezzo: prezzo });
        salvaProdottiPersonalizzati(elenco);

        var quantitaSalvate = catturaQuantita();
        document.getElementById('nuovoNome').value = '';
        costruisciUI(NOME_CATEGORIA_PERSONALIZZATA);
        ripristinaQuantita(quantitaSalvate);
        calcolaTotali();
      });
    }

    contCategorie.querySelectorAll('[data-elimina-prodotto]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-elimina-prodotto');
        var nomeProdotto = btn.closest('.riga-prodotto').querySelector('.nome').firstChild.textContent.trim();
        if (!confirm('Eliminare "' + nomeProdotto + '" dai tuoi prodotti?')) return;

        var nuovoElenco = caricaProdottiPersonalizzati().filter(function (p) { return p.id !== id; });
        salvaProdottiPersonalizzati(nuovoElenco);

        var quantitaSalvate = catturaQuantita();
        costruisciUI(NOME_CATEGORIA_PERSONALIZZATA);
        ripristinaQuantita(quantitaSalvate);
        calcolaTotali();
      });
    });
  }

  // ---------- Modifica costo/prezzo di un prodotto (con conferma) ----------
  function modificaValore(v, personalizzata, nomeCategoria, campo) {
    var valoreAttuale = campo === 'prezzo' ? v.prezzo : v.costo;
    var etichetta = campo === 'prezzo' ? 'prezzo cliente' : 'costo';

    var input = prompt('Nuovo ' + etichetta + ' per "' + v.nome + '"\n(attuale ' + euro(valoreAttuale) + '):', String(valoreAttuale).replace('.', ','));
    if (input === null) return;

    var nuovoValore = parseFloat(input.replace(',', '.').trim());
    if (isNaN(nuovoValore) || nuovoValore < 0) {
      alert('Valore non valido, non è stato cambiato nulla.');
      return;
    }

    var confermato = confirm('Confermi?\n\n' + etichetta + ' di "' + v.nome + '"\n' + euro(valoreAttuale) + ' → ' + euro(nuovoValore));
    if (!confermato) return;

    if (personalizzata) {
      var elenco = caricaProdottiPersonalizzati();
      var idx = elenco.findIndex(function (p) { return p.id === v.id; });
      if (idx >= 0) {
        elenco[idx][campo] = nuovoValore;
        salvaProdottiPersonalizzati(elenco);
      }
    } else {
      var overrides = caricaOverridePrezzi();
      if (!overrides[v.id]) overrides[v.id] = {};
      overrides[v.id][campo] = nuovoValore;
      salvaOverridePrezzi(overrides);
    }

    var quantitaSalvate = catturaQuantita();
    costruisciUI(nomeCategoria);
    ripristinaQuantita(quantitaSalvate);
    calcolaTotali();
  }

  // ---------- Calcolo ----------
  function calcolaTotali() {
    var totIncasso = 0;
    var totGuadagno = 0;

    TUTTE_VARIANTI.forEach(function (v) {
      var input = document.querySelector('input[data-id="' + v.id + '"]');
      var q = parseFloat(input.value) || 0;
      var incasso = q * v.prezzo;
      var guadagno = q * (v.prezzo - v.costo);
      totIncasso += incasso;
      totGuadagno += guadagno;

      var box = document.querySelector('[data-guadagno="' + v.id + '"]');
      if (q > 0) {
        box.innerHTML = '<b>' + euro(incasso) + '</b>' + euro(guadagno) + ' guad.';
      } else {
        box.innerHTML = '<b>0,00 €</b>0,00 € guad.';
      }
    });

    var totaleRichiesto = parseFloat(document.getElementById('totaleRichiesto').value) || 0;
    var differenza = totaleRichiesto - totIncasso;
    var guadagnoFinale = totGuadagno + (totaleRichiesto > 0 ? differenza : 0);

    document.getElementById('totaleProdottiMostrato').textContent = euro(totIncasso);
    document.getElementById('differenzaMostrata').textContent = euro(differenza);
    document.getElementById('totIncasso').textContent = euro(totIncasso);
    document.getElementById('totGuadagno').textContent = euro(guadagnoFinale);

    var nota = document.getElementById('notaGuadagno');
    if (totaleRichiesto > 0 && differenza !== 0) {
      nota.textContent = 'prodotti ' + euro(totGuadagno) + ' ' + (differenza > 0 ? '+' : '−') +
        ' altre prestazioni ' + euro(Math.abs(differenza));
      nota.style.display = 'block';
    } else {
      nota.textContent = '';
      nota.style.display = 'none';
    }

    return {
      totIncasso: totIncasso,
      totGuadagno: totGuadagno,
      totGuadagnoFinale: guadagnoFinale,
      totaleRichiesto: totaleRichiesto,
      differenza: differenza
    };
  }

  contCategorie.addEventListener('input', calcolaTotali);
  document.getElementById('totaleRichiesto').addEventListener('input', calcolaTotali);

  // ---------- Salvataggio visite (localStorage, elenco unico non legato al giorno) ----------
  var CHIAVE_VISITE = 'visiteSalvate';

  function caricaVisite() {
    try {
      return JSON.parse(localStorage.getItem(CHIAVE_VISITE) || '[]');
    } catch (e) { return []; }
  }
  function salvaVisiteArray(arr) {
    localStorage.setItem(CHIAVE_VISITE, JSON.stringify(arr));
  }

  function disegnaListaVisite() {
    var visite = caricaVisite();
    var cont = document.getElementById('listaVisite');
    cont.innerHTML = '';

    if (visite.length === 0) {
      cont.innerHTML = '<div class="vuoto-giorno">Nessuna visita salvata</div>';
      return;
    }

    visite.slice().reverse().forEach(function (v) {
      var riga = document.createElement('details');
      riga.className = 'visita-salvata';
      var nome = v.cliente ? v.cliente : '(cliente senza nome)';

      var guadagnoFinale = (typeof v.totGuadagnoFinale === 'number') ? v.totGuadagnoFinale : v.totGuadagno;

      var righeDettaglio = (v.righe || []).map(function (r) {
        return '<div>' + r.nome + ' × ' + r.quantita + ' — ' + euro(r.incasso) + ' (guad. ' + euro(r.guadagno) + ')</div>';
      }).join('');
      if (v.totaleRichiesto > 0) {
        righeDettaglio += '<div class="riga-altre">Altre prestazioni: ' + euro(v.differenza) + ' (totale richiesto ' + euro(v.totaleRichiesto) + ')</div>';
      }
      if (!righeDettaglio) {
        righeDettaglio = '<div>Nessun prodotto registrato</div>';
      }

      var notaGuadagno = '';
      if (v.totaleRichiesto > 0 && v.differenza) {
        notaGuadagno = '<div class="nota-guadagno-salvata">prodotti ' + euro(v.totGuadagno) + ' ' +
          (v.differenza > 0 ? '+' : '−') + ' altre prestazioni ' + euro(Math.abs(v.differenza)) + '</div>';
      }

      riga.innerHTML =
        '<summary><div class="info"><span class="nome">' + nome + '</span><br>' +
        '<span class="ora">' + (v.data || '') + ' ' + v.ora + ' · incasso ' + euro(v.totIncasso) + '</span></div>' +
        '<div class="guadagno-tot">' + euro(guadagnoFinale) + notaGuadagno + '</div>' +
        '<div class="azioni">' +
        '<button class="condividi" data-condividi="' + v.id + '">⤴</button>' +
        '<button class="elimina" data-elimina="' + v.id + '">✕</button>' +
        '</div></summary>' +
        '<div class="dettaglio-visita">' + righeDettaglio + '</div>';
      cont.appendChild(riga);
    });

    cont.querySelectorAll('[data-elimina]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        var id = btn.getAttribute('data-elimina');
        if (!confirm('Eliminare questa visita?')) return;
        if (!confirm('Sicura? Non si può annullare.')) return;
        var nuove = caricaVisite().filter(function (v) { return v.id !== id; });
        salvaVisiteArray(nuove);
        disegnaListaVisite();
      });
    });

    cont.querySelectorAll('[data-condividi]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        var id = btn.getAttribute('data-condividi');
        var v = caricaVisite().find(function (x) { return x.id === id; });
        if (!v) return;
        condividiVisita(v);
      });
    });
  }

  function testoVisita(v) {
    var nome = v.cliente ? v.cliente : '(cliente senza nome)';
    var righe = (v.righe || []).map(function (r) {
      return '- ' + r.nome + ' × ' + r.quantita + ' — ' + euro(r.incasso);
    }).join('\n');

    var guadagnoFinale = (typeof v.totGuadagnoFinale === 'number') ? v.totGuadagnoFinale : v.totGuadagno;

    var testo = 'Visita: ' + nome + '\n' + (v.data || '') + ' ' + v.ora + '\n\n';
    testo += righe || 'Nessun prodotto registrato';
    if (v.totaleRichiesto > 0) {
      testo += '\n\nAltre prestazioni: ' + euro(v.differenza) + ' (totale richiesto ' + euro(v.totaleRichiesto) + ')';
    }
    testo += '\n\nTotale incasso: ' + euro(v.totIncasso);
    testo += '\nGuadagno: ' + euro(guadagnoFinale);
    return testo;
  }

  function condividiVisita(v) {
    var testo = testoVisita(v);
    if (navigator.share) {
      navigator.share({ title: 'Visita', text: testo }).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(testo).then(function () {
        alert('Condivisione diretta non disponibile: testo copiato negli appunti, incollalo dove vuoi.');
      });
    } else {
      alert(testo);
    }
  }

  document.getElementById('btnSalva').addEventListener('click', function () {
    var totali = calcolaTotali();

    var righe = [];
    TUTTE_VARIANTI.forEach(function (v) {
      var input = document.querySelector('input[data-id="' + v.id + '"]');
      var q = parseFloat(input.value) || 0;
      if (q > 0) {
        righe.push({
          nome: v.nome,
          quantita: q,
          incasso: q * v.prezzo,
          guadagno: q * (v.prezzo - v.costo)
        });
      }
    });

    var visite = caricaVisite();
    visite.push({
      id: Date.now().toString(36),
      data: dataBreve(),
      ora: new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }),
      cliente: document.getElementById('nomeCliente').value.trim(),
      totIncasso: totali.totIncasso,
      totGuadagno: totali.totGuadagno,
      totGuadagnoFinale: totali.totGuadagnoFinale,
      totaleRichiesto: totali.totaleRichiesto,
      differenza: totali.differenza,
      righe: righe
    });
    salvaVisiteArray(visite);
    disegnaListaVisite();

    // reset modulo per la prossima visita (resta dove si trovava, vicino al salvataggio)
    document.getElementById('nomeCliente').value = '';
    document.getElementById('totaleRichiesto').value = '';
    document.querySelectorAll('#categorie input[type="number"]').forEach(function (i) { i.value = ''; });
    calcolaTotali();
  });

  document.getElementById('btnPulisci').addEventListener('click', function () {
    if (!confirm('Svuotare cliente, quantità e totale richiesto del modulo attuale?')) return;
    document.getElementById('nomeCliente').value = '';
    document.getElementById('totaleRichiesto').value = '';
    document.querySelectorAll('#categorie input[type="number"]').forEach(function (i) { i.value = ''; });
    calcolaTotali();
  });

  document.getElementById('btnCancellaTutto').addEventListener('click', function () {
    if (!confirm('Cancellare tutte le visite salvate?')) return;
    if (!confirm('Sicura? Non si può annullare, verranno cancellate tutte.')) return;
    salvaVisiteArray([]);
    disegnaListaVisite();
  });

  // ---------- Avvio ----------
  document.getElementById('dataOggi').textContent = dataLeggibile();
  costruisciUI();
  calcolaTotali();
  disegnaListaVisite();

})();
</script>
